name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A fast follow-up push cancels the stale run rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Standard 3: the build must succeed with no credentials present.
      # If this step needs a secret, the demo needs a network, and the demo
      # will fail in front of an audience.
      - name: Build
        run: npm run build
